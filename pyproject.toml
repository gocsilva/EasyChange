[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easychange"
version = "0.1.0"
description = "Machine-first development workspace for AI software agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "qrcode>=7.4"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
easychange = "easychange.cli:main"
easychange-gui = "easychange.gui:main"

[tool.setuptools.packages.find]
include = ["easychange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
