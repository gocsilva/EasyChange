[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easychange"
version = "0.1.0"
description = "Machine-first development workspace for AI software agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
easychange = "easychange.cli:main"
easychange-gui = "easychange.gui:main"
easychange-api = "easychange.api.server:main"
easychange-mcp = "easychange.mcp.server:main"

[tool.setuptools.packages.find]
include = ["easychange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
